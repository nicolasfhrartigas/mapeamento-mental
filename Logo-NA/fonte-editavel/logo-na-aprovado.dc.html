<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;padding:0;}
  a{color:#F2F0EB;} a:hover{color:#EA5B13;}
</style>
</helmet>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:{{ bg }};padding:48px;box-sizing:border-box;">
  
<svg viewBox="46 30 804 1216" style="height:min(88vh,1000px);display:block;" shape-rendering="geometricPrecision" xmlns="http://www.w3.org/2000/svg" aria-label="Logo NA">
    <!-- white letters -->
    <path fill="#F2F0EB" d="M130 80 L726 676 L726 84 L800 84 L800 850 L726 776 L204 254 L204 850 L130 975 Z"></path>
    <g transform="translate(38.152 56.467) scale(0.952787)">
      <path fill="#F2F0EB" d="M448 610 L96.4 1196 L182.4 1196 L448 753 Z M448 610 L799.6 1196 L713.6 1196 L448 753 Z M412.5 952 L653.2 952 L697.6 1026 L385.6 1026 Z"></path>
      <path fill="#79993F" d="M448 610 L533.8 753 L362.2 753 Z M362.2 753 L448 753 L394.6 842 Z M533.8 753 L644.2 936.7 L611.8 1026 L448 753 Z M412.5 952 L638.7 952 L611.8 1026 L385.6 1026 Z"></path>
    </g>
    <!-- color overlays -->
    <path fill="#EA5B13" d="M726 84 L800 84 L800 750 L726 676 Z"></path>
  </svg></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;background&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#0B0B0B&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#0B0B0B&quot;,&quot;#1A1A18&quot;,&quot;#F2F0EB&quot;,&quot;#FFFFFF&quot;]}}">
class Component extends DCLogic {
  renderVals() {
    return { bg: this.props.background ?? '#0B0B0B' };
  }
}
</script>
</body>
</html>
